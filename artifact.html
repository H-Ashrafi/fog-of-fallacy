<title>Fog of Fallacy</title>
<meta name="description" content="Walk around Maple Street, talk to the kids, and spot the tricks before they trick you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { corePlugins: { preflight: false }, theme: { extend: {
    colors: { pine: '#14262B', mist: '#8FB3B0', paper: '#F4E8CC', ink: '#2A2420', lantern: '#F6B544', coral: '#FF7B6B', mint: '#BFEBD6', fair: '#63C48F' },
    fontFamily: { display: ['"Baloo 2"', 'system-ui', 'sans-serif'], body: ['Andika', 'Verdana', 'sans-serif'] }
  } } };
</script>
<link rel="stylesheet" href="css/app.css">
<main id="app">

  <section id="title" class="screen title">
    <p class="eyebrow">Maple Street</p>
    <h1>Fog of Fallacy</h1>
    <p class="lede">Walk around. Talk to the kids. Spot the tricks before they trick you.</p>
    <label class="eyebrow" for="name-input">Your name</label>
    <input id="name-input" class="input" maxlength="16" autocomplete="off" placeholder="Your name">
    <p class="eyebrow">Pick your look</p>
    <div id="looks" class="looks"></div>
    <button id="start" class="btn btn-big btn-wide" type="button">Start</button>
    <button id="reset" class="btn btn-ghost btn-sm" type="button" hidden>Start again</button>
  </section>

  <section id="play" class="screen play" hidden>
    <div class="hud">
      <button id="hud-home" class="iconbtn" type="button" aria-label="Title">🏠</button>
      <span class="pill pill-lantern">🏅 <span id="hud-badges">0 / 8</span></span>
      <span class="grow"></span>
      <button id="hud-book" class="iconbtn" type="button" aria-label="Trick book">📖</button>
      <button id="hud-sound" class="iconbtn" type="button" aria-label="Sound">🔔</button>
    </div>

    <div class="stage">
      <canvas id="game" aria-label="Maple Street"></canvas>

      <div id="dlg" class="dlg" hidden>
        <canvas id="dlg-portrait" width="72" height="80"></canvas>
        <div class="dlg-body">
          <b id="dlg-name" class="dlg-name"></b>
          <p id="dlg-text" class="dlg-text"></p>
          <div id="dlg-choices" class="choices" hidden></div>
          <button id="dlg-next" class="dlg-next" type="button">Next ▸</button>
        </div>
      </div>

      <div id="scene" class="scene" hidden>
        <img id="scene-img" alt="">
        <p id="scene-text"></p>
        <button id="scene-next" class="btn btn-big" type="button">Next ▸</button>
      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <button type="button" data-dir="up" aria-label="Up">▲</button>
        <button type="button" data-dir="left" aria-label="Left">◀</button>
        <button type="button" data-dir="right" aria-label="Right">▶</button>
        <button type="button" data-dir="down" aria-label="Down">▼</button>
      </div>
      <button id="btn-a" class="btn-a" type="button" aria-label="Talk">A</button>
    </div>
  </section>

  <div id="card" class="overlay" hidden>
    <div class="box paper">
      <p id="card-eyebrow" class="eyebrow"></p>
      <h2 id="card-title"></h2>
      <img id="card-img" class="card-img" alt="">
      <p id="card-one" class="big"></p>
      <p id="card-spot" class="spot"></p>
      <button id="card-btn" class="btn btn-big btn-wide" type="button">OK</button>
    </div>
  </div>

  <section id="book" class="screen" hidden>
    <div class="flex items-center justify-between gap-2">
      <h2>Trick book</h2>
      <button id="book-close" class="btn btn-ghost btn-sm" type="button">Back</button>
    </div>
    <div id="book-grid" class="book-grid"></div>
  </section>

  <div id="end" class="overlay" hidden>
    <div class="box paper">
      <p class="eyebrow">Maple Street</p>
      <h2>The fog is gone!</h2>
      <p class="big">You spotted all eight tricks. Nobody can trick you now.</p>
      <div id="end-cards" class="end-cards"></div>
      <button id="end-close" class="btn btn-big btn-wide" type="button">Keep exploring</button>
    </div>
  </div>

</main>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
